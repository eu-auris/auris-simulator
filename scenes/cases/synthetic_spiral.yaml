#
# Example case: electrode array (Cosserat rod) inserted into a synthetic spiral duct.
# ALL NUMERICAL VALUES ARE ILLUSTRATIVE PLACEHOLDERS, not anatomical or device data.
# Calibrated device profiles and specimen meshes are not stored here (see data/registry.yaml).
schema_version: "0.1"
description: Teaching example on a synthetic cochlea-like duct (not anatomical).
units: {length: m, mass: kg, time: s, force: N, pressure: Pa}

anatomy:
  id: synthetic-spiral-001
  frame: synthetic_spiral
  source:
    type: synthetic
    generator: spiral_duct
    parameters:          # see auris_sim.geometry.SpiralDuct
      turns: 2.5
      spiral_radius_base: 4.0e-3
      spiral_radius_apex: 1.0e-3
      height: 3.0e-3
      duct_radius_base: 0.9e-3
      duct_radius_apex: 0.5e-3

instrument:
  type: electrode_array
  model: cosserat        # frame-primary Cosserat rod (Frames2StrainCosseratMapping)
  length: 0.025
  radius: 0.3e-3
  n_sections: 40         # uniform sections; or give an explicit "sections:" list
  young_modulus: 1.0e8
  poisson_ratio: 0.45
  density: 1100

strategy:
  insertion_speed: 1.0e-3   # m/s
  insertion_depth: 0.020    # m, tip depth beyond the entrance
  entry_offset: 3.0e-4      # m, tip-to-entrance distance at the start

contact:
  friction: 0.1
  alarm_distance: 2.0e-4
  contact_distance: 5.0e-5

simulation:
  dt: 0.01
  duration: 21.0
  gravity: [0, 0, 0]

outputs: [tip_trajectory, insertion_depth, insertion_force, metrics]
