#
# Reusable workflow: install SOFA binaries, build the Cosserat plugin and the
# AurisSimulator plugin, then run the scene tests (pytest -m sofa).
name: SOFA build

on:
  workflow_call:
    inputs:
      sofa_version:
        description: "SOFA release tag (e.g. v26.06.00) or branch (master)"
        type: string
        required: true
      cosserat_ref:
        description: "SofaDefrost/Cosserat commit, tag or branch"
        type: string
        required: true
      os:
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  build:
    name: SOFA ${{ inputs.sofa_version }} / ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    steps:
      - name: Set up SOFA
        id: sofa
        uses: sofa-framework/sofa-setup-action@v5
        with:
          sofa_root: ${{ github.workspace }}/sofa
          sofa_version: ${{ inputs.sofa_version }}
          sofa_scope: standard

      - name: Check out AURIS simulator
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORKSPACE_SRC_PATH }}

      - name: Check out Cosserat
        uses: actions/checkout@v4
        with:
          repository: SofaDefrost/Cosserat
          ref: ${{ inputs.cosserat_ref }}
          path: deps/Cosserat

      - name: Build Cosserat
        shell: bash
        run: |
          cmake -S deps/Cosserat -B deps/build-Cosserat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SOFA_ROOT/lib/cmake;$SOFA_ROOT/plugins/SofaPython3/lib/cmake" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/deps/install" \
            -DCOSSERAT_BUILD_TESTS=OFF \
            -DCOSSERAT_BUILD_EXAMPLES=OFF
          cmake --build deps/build-Cosserat --target install

      - name: Build AurisSimulator plugin
        shell: bash
        run: |
          cmake -S "$WORKSPACE_SRC_PATH" -B "$WORKSPACE_BUILD_PATH" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SOFA_ROOT/lib/cmake" \
            -DCMAKE_INSTALL_PREFIX="$WORKSPACE_INSTALL_PATH"
          cmake --build "$WORKSPACE_BUILD_PATH" --target install

      - name: Scene tests
        shell: bash
        env:
          PYTHON_EXE: ${{ steps.sofa.outputs.python_exe }}
        run: |
          export SOFA_PLUGIN_PATH="$GITHUB_WORKSPACE/deps/install/lib:$WORKSPACE_INSTALL_PATH/lib"
          export PYTHONPATH="$SOFA_ROOT/plugins/SofaPython3/lib/python3/site-packages${PYTHONPATH:+:$PYTHONPATH}"
          "$PYTHON_EXE" -m pip install -e "$WORKSPACE_SRC_PATH[dev]"
          cd "$WORKSPACE_SRC_PATH"
          "$PYTHON_EXE" -c "import Sofa; print('SofaPython3 OK')"
          "$PYTHON_EXE" -m pytest -m sofa -v
