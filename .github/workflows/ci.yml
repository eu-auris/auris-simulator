#
# Blocking CI: Python checks (no SOFA) + plugin build and scene tests against the
# pinned SOFA release. The non-blocking SOFA master job is in sofa-master.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (no SOFA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Licence headers (REUSE)
        run: reuse lint
      - name: Unit tests
        run: python -m pytest -m "not sofa"

  sofa-release:
    name: SOFA release
    uses: ./.github/workflows/sofa-build.yml
    with:
      # Pinned SOFA release. Update twice a year, after each SOFA release (June/December),
      # together with the BeamAdapter commit (head of its matching release branch).
      sofa_version: v26.06.00
      beamadapter_ref: 5290893fd149b57045921aa37d5911bc47ef80cd  # BeamAdapter branch v26.06
