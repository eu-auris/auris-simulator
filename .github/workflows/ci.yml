#
# Blocking CI: Python checks (no SOFA) + plugin build and scene tests against the
# pinned SOFA release. The non-blocking SOFA master job is in sofa-master.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (no SOFA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Licence headers (REUSE)
        run: reuse lint
      - name: Unit tests
        run: python -m pytest -m "not sofa"

  sofa:
    name: SOFA + Cosserat
    uses: ./.github/workflows/sofa-build.yml
    with:
      # The implant model needs Frames2StrainCosseratMapping, which is on Cosserat main but
      # not in the v26.06 release branch. Until SOFA v26.12 is out, build against SOFA master
      # with Cosserat pinned to a known commit; then pin both to v26.12 (and update twice a year).
      sofa_version: master
      cosserat_ref: fa71b1b0bffa9038358dbb7a380e5a0e2c43683a  # Cosserat main, 2026-11-04
